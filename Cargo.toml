[package]
name = "smolgnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small native Rust implementation of the GNet protocol suite"
license = "0BSD"
repository = "https://github.com/nickik/smolgnet"
build = false
autotests = false
autoexamples = false
autobenches = false

[features]
default = ["std"]
std = []
p4-gdp-compare = ["std", "dep:p4rs", "dep:p4-macro", "dep:bitvec", "dep:colored", "dep:num", "dep:usdt"]

[dependencies]
p4rs = { git = "https://github.com/oxidecomputer/p4", rev = "4645231880ccae40efd2bc583b643944ab0f0a20", package = "p4rs", optional = true }
p4-macro = { git = "https://github.com/oxidecomputer/p4", rev = "4645231880ccae40efd2bc583b643944ab0f0a20", package = "p4-macro", optional = true }
bitvec = { version = "1.0", optional = true }
colored = { version = "3", optional = true }
num = { version = "0.4", features = ["serde"], optional = true }
usdt = { version = "0.5.0", optional = true }

[dev-dependencies]
smoltcp = { version = "=0.14.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"] }

[[test]]
name = "wire"
path = "tests/wire.rs"

[[test]]
name = "link"
path = "tests/link.rs"

[[test]]
name = "transport"
path = "tests/transport.rs"

[[test]]
name = "endpoint"
path = "tests/endpoint.rs"

[[test]]
name = "behavior"
path = "tests/behavior.rs"

[[test]]
name = "faults"
path = "tests/faults.rs"

[[test]]
name = "performance"
path = "tests/performance.rs"

[[test]]
name = "p4_performance"
path = "tests/p4_performance.rs"
required-features = ["p4-gdp-compare"]
