[package]
name = "smolgnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small native Rust implementation of the GNet protocol suite"
license = "0BSD"
repository = "https://github.com/nickik/smolgnet"
build = false
autotests = false
autoexamples = false
autobenches = false

[features]
default = ["std"]
std = []

[dependencies]

[[test]]
name = "wire"
path = "tests/wire.rs"

[[test]]
name = "link"
path = "tests/link.rs"

[[test]]
name = "transport"
path = "tests/transport.rs"

[[test]]
name = "endpoint"
path = "tests/endpoint.rs"
