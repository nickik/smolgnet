[package]
name = "smolgnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small native Rust implementation of the GNet protocol suite"
license = "0BSD"
repository = "https://github.com/nickik/smolgnet"
build = false
autotests = false
autoexamples = false
autobenches = false

[features]
default = ["std"]
std = []

[dependencies]

[dev-dependencies]
libc = "0.2"
smoltcp = { version = "=0.14.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"] }

[[test]]
name = "wire"
path = "tests/wire.rs"

[[test]]
name = "link"
path = "tests/link.rs"

[[test]]
name = "transport"
path = "tests/transport.rs"

[[test]]
name = "endpoint"
path = "tests/endpoint.rs"

[[test]]
name = "behavior"
path = "tests/behavior.rs"

[[test]]
name = "fault"
path = "tests/fault.rs"

[[test]]
name = "performance"
path = "tests/performance.rs"

[[test]]
name = "tap_performance"
path = "tests/tap_performance.rs"
required-features = ["std"]

[[example]]
name = "perf_compare"
path = "examples/perf_compare.rs"
required-features = ["std"]
