name: GCTL Node Discovery

on:
  pull_request:
    paths:
      - 'src/dynamic_routing.rs'
      - 'src/router_adjacency.rs'
      - 'src/wire/gctl.rs'
      - 'src/wire/gctl_routing.rs'
      - 'src/wire/mod.rs'
      - 'src/lib.rs'
      - 'tests/gctl_node_discovery.rs'
      - 'tests/dynamic_routing_stage1.rs'
      - 'tests/dynamic_routing_stage2.rs'
      - 'tests/wire.rs'
      - 'Cargo.toml'
      - '.github/workflows/gctl-node-discovery.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run GCTL routing, adjacency, discovery and existing wire tests
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 90s \
            cargo test --test dynamic_routing_stage1 --test dynamic_routing_stage2 --test gctl_node_discovery --test wire -- --nocapture --test-threads=1
