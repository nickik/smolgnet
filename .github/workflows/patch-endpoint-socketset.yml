name: Patch Endpoint SocketSet

on:
  push:
    branches: [heapless-storage-socketset]
    paths:
      - .github/workflows/patch-endpoint-socketset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: heapless-storage-socketset
      - uses: dtolnay/rust-toolchain@stable
      - name: Migrate Endpoint tunnel storage to OwnedSocketSet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/endpoint.rs')
          s = p.read_text()
          if 'use crate::socket::OwnedSocketSet;' not in s:
              s = s.replace('use crate::link::{DlpConfig, DlpEndpoint, Flit, GnetFrame, VcMode};\n', 'use crate::link::{DlpConfig, DlpEndpoint, Flit, GnetFrame, VcMode};\nuse crate::socket::OwnedSocketSet;\n', 1)
          s = s.replace('tunnels: BTreeMap<u32, TunnelRecord>,', 'tunnels: OwnedSocketSet<TunnelRecord>,')
          s = s.replace('tunnels: BTreeMap::new(),', 'tunnels: OwnedSocketSet::new(),')

          anchor = '''    fn alloc_tunnel(&mut self) -> (u32, u32) {\n        let t = self.next_tunnel;\n        self.next_tunnel = self.next_tunnel.wrapping_add(1).max(1);\n        let r = self.next_reset;\n        self.next_reset = self.next_reset.wrapping_add(1).max(1);\n        (t, r)\n    }\n'''
          helper = anchor + '''\n    fn tunnel_record(&self, local_receive_id: u32) -> Result<&TunnelRecord> {\n        let handle = self\n            .tunnels\n            .find(|rec| rec.tunnel.local_receive_id == local_receive_id)\n            .ok_or(Error::UnknownTunnel)?;\n        self.tunnels.get(handle).map_err(|_| Error::UnknownTunnel)\n    }\n\n    fn tunnel_record_mut(&mut self, local_receive_id: u32) -> Result<&mut TunnelRecord> {\n        let handle = self\n            .tunnels\n            .find(|rec| rec.tunnel.local_receive_id == local_receive_id)\n            .ok_or(Error::UnknownTunnel)?;\n        self.tunnels.get_mut(handle).map_err(|_| Error::UnknownTunnel)\n    }\n'''
          if 'fn tunnel_record(&self' not in s:
              if anchor not in s:
                  raise SystemExit('alloc_tunnel anchor not found')
              s = s.replace(anchor, helper, 1)

          s = re.sub(r'self\.tunnels\.get_mut\(&([^\)]+)\)\.ok_or\(Error::UnknownTunnel\)\?', r'self.tunnel_record_mut(\1)?', s)
          s = re.sub(r'self\.tunnels\.get\(&([^\)]+)\)\.ok_or\(Error::UnknownTunnel\)\?', r'self.tunnel_record(\1)?', s)
          s = re.sub(r'self\.tunnels\s*\.get_mut\(&([^\)]+)\)\s*\.ok_or\(Error::UnknownTunnel\)\?', r'self.tunnel_record_mut(\1)?', s)
          s = re.sub(r'self\.tunnels\s*\.get\(&([^\)]+)\)\s*\.ok_or\(Error::UnknownTunnel\)\?', r'self.tunnel_record(\1)?', s)

          s = s.replace('self.tunnels.insert(local, TunnelRecord { peer: remote, tunnel });', 'self.tunnels.add(TunnelRecord { peer: remote, tunnel })?;')
          s = s.replace('self.tunnels.insert(local, TunnelRecord { peer: src, tunnel });', 'self.tunnels.add(TunnelRecord { peer: src, tunnel })?;')
          s = s.replace('for rec in self.tunnels.values_mut() {', 'for (_, rec) in self.tunnels.iter_mut() {')

          bad = []
          for line in s.splitlines():
              if 'self.tunnels.insert' in line or 'self.tunnels.values' in line:
                  bad.append(line)
              if ('self.tunnels.get(' in line or 'self.tunnels.get_mut(' in line) and '(handle)' not in line:
                  bad.append(line)
          if bad:
              raise SystemExit('unmigrated tunnel operations: ' + repr(bad))
          p.write_text(s)
          PY
          cargo test --all-targets
          cargo check --no-default-features
          cargo test --no-default-features --test heapless_api
      - name: Commit migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/endpoint.rs
          git commit -m 'Store hosted GTS tunnels in SocketSet'
          git push origin HEAD:heapless-storage-socketset
