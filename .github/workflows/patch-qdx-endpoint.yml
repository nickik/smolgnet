name: Patch QDX endpoint API

on:
  push:
    branches: [qdx-segment-path]
    paths:
      - .github/workflows/patch-qdx-endpoint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qdx-segment-path
      - name: Add frame endpoint methods
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/endpoint.rs')
          s = p.read_text()
          old_import = 'use crate::link::{DlpConfig, DlpEndpoint, Flit, VcMode};'
          new_import = 'use crate::link::{DlpConfig, DlpEndpoint, Flit, GnetFrame, VcMode};'
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          elif new_import not in s:
              raise SystemExit('expected link import not found')

          old = '''    pub fn poll_tx_flit(&mut self) -> Result<Option<Flit>> {\n        self.maybe_request_link_credit()?;\n        self.dlp.poll_tx()\n    }\n\n    pub fn receive_flit(&mut self, flit: Flit, now: u64) -> Result<bool> {\n        if let Some(packet) = self.dlp.receive(flit)? {\n            self.handle_gdp(packet, now)?;\n            self.advertise_link_credit(false)?;\n            Ok(true)\n        } else {\n            Ok(false)\n        }\n    }\n'''
          new = '''    pub fn poll_tx_flit(&mut self) -> Result<Option<Flit>> {\n        self.maybe_request_link_credit()?;\n        self.dlp.poll_tx()\n    }\n\n    /// Poll one complete GNET frame at the QDX-GNET host/device boundary.\n    /// Raw flit backends should continue to use `poll_tx_flit`/DLP burst APIs.\n    pub fn poll_tx_frame(&mut self) -> Result<Option<GnetFrame>> {\n        self.maybe_request_link_credit()?;\n        self.dlp.poll_tx_frame()\n    }\n\n    pub fn receive_flit(&mut self, flit: Flit, now: u64) -> Result<bool> {\n        if let Some(packet) = self.dlp.receive(flit)? {\n            self.handle_gdp(packet, now)?;\n            self.advertise_link_credit(false)?;\n            Ok(true)\n        } else {\n            Ok(false)\n        }\n    }\n\n    /// Receive one complete GNET frame from a QDX-GNET-style controller.\n    /// The frame boundary is trusted as a link/device boundary, while GDP and\n    /// GTS CRCs are still decoded and validated normally.\n    pub fn receive_frame(&mut self, frame: GnetFrame, now: u64) -> Result<bool> {\n        let packet = self.dlp.receive_frame(frame)?;\n        self.handle_gdp(packet, now)?;\n        self.advertise_link_credit(false)?;\n        Ok(true)\n    }\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'pub fn poll_tx_frame' not in s:
              raise SystemExit('expected endpoint flit methods not found')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/endpoint.rs
          git commit -m 'Expose QDX-GNET frame I/O on Endpoint'
          git push origin HEAD:qdx-segment-path
