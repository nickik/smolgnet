name: DLP link control

on:
  pull_request:
    paths:
      - 'src/dlp_control.rs'
      - 'src/lib.rs'
      - 'tests/dlp_link_control.rs'
      - 'Cargo.toml'
      - 'docs/DLP_LINK_CONTROL_V0_1.md'
      - '.github/workflows/dlp-link-control.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native DLP link-control implementation
        run: cargo check --lib
      - name: Run DLP tests with bounded runtime and debug output
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 90s \
            cargo test --test dlp_link_control -- --nocapture --test-threads=1
