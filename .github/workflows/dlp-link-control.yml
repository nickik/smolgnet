name: DLP link control

on:
  pull_request:
    paths:
      - 'src/dlp_control.rs'
      - 'src/endpoint/core.rs'
      - 'src/endpoint/link_api.rs'
      - 'src/lib.rs'
      - 'tests/dlp_link_control.rs'
      - 'Cargo.toml'
      - 'docs/DLP_LINK_CONTROL_V0_1.md'
      - '.github/workflows/dlp-link-control.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize DLP sources once
        if: github.event_name == 'pull_request'
        run: |
          rustfmt src/dlp_control.rs tests/dlp_link_control.rs
          if ! git diff --quiet -- src/dlp_control.rs tests/dlp_link_control.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/dlp_control.rs tests/dlp_link_control.rs
            git commit -m "Format DLP link-control sources"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Check native DLP link-control implementation
        run: cargo check --lib
      - name: Run DLP tests with bounded runtime and debug output
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 90s \
            cargo test --test dlp_link_control -- --nocapture --test-threads=1
