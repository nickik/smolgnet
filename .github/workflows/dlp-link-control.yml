name: DLP link control

on:
  pull_request:
    paths:
      - 'src/dlp_control.rs'
      - 'src/lib.rs'
      - 'tests/dlp_link_control.rs'
      - 'Cargo.toml'
      - 'docs/DLP_LINK_CONTROL_V0_1.md'
      - '.github/workflows/dlp-link-control.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native DLP link-control implementation
        run: cargo check --all-targets
      - name: Run native DLP link-control conformance and GTS integration tests
        run: cargo test --test dlp_link_control
