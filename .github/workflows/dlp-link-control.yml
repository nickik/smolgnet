name: DLP link control

on:
  pull_request:
    paths:
      - 'src/dlp_control.rs'
      - 'src/lib.rs'
      - 'tests/dlp_link_control.rs'
      - 'Cargo.toml'
      - 'docs/DLP_LINK_CONTROL_V0_1.md'
      - '.github/workflows/dlp-link-control.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native DLP link-control implementation
        run: cargo check --lib
      - name: Diagnose credit retry regression with divisible link window
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/dlp_link_control.rs')
          s = p.read_text()
          old = 'cfg(40, VcMode::Two, 40), 32).unwrap();'
          assert s.count(old) == 2, s.count(old)
          p.write_text(s.replace(old, 'cfg(64, VcMode::Two, 64), 32).unwrap();'))
          PY
          echo 'Diagnostic: credit-retry test uses a 64-flit window so 32-flit GDP/GTS frames can exhaust it exactly.'
          timeout --signal=TERM --kill-after=2s 20s \
            cargo test --test dlp_link_control lost_gctl_credit_request_is_retried_and_same_gts_stream_continues -- --exact --nocapture --test-threads=1
      - name: Run remaining DLP tests with bounded runtime and debug output
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 60s \
            cargo test --test dlp_link_control -- --nocapture --test-threads=1
