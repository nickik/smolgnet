name: Patch heapless core

on:
  push:
    branches: [heapless-storage-socketset]
    paths:
      - .github/workflows/patch-heapless.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: heapless-storage-socketset
      - name: Gate owned GTS wire packets behind alloc
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/wire/gts.rs')
          s = p.read_text()
          s = s.replace(
              'use alloc::vec;\nuse alloc::vec::Vec;\n',
              '#[cfg(feature = "alloc")]\nuse alloc::vec;\n#[cfg(feature = "alloc")]\nuse alloc::vec::Vec;\n',
              1,
          )
          marker = '#[derive(Debug, Clone, PartialEq, Eq)]\npub enum GtsPacket {'
          if marker in s and '#[cfg(feature = "alloc")]\n' + marker not in s:
              s = s.replace(marker, '#[cfg(feature = "alloc")]\n' + marker, 1)
          marker2 = 'impl GtsPacket {'
          if marker2 in s and '#[cfg(feature = "alloc")]\n' + marker2 not in s:
              s = s.replace(marker2, '#[cfg(feature = "alloc")]\n' + marker2, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/wire/gts.rs
          git commit -m 'Gate owned GTS packets behind alloc feature'
          git push origin HEAD:heapless-storage-socketset
