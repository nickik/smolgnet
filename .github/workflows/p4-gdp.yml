name: P4 GDP x4c

on:
  push:
    branches: [main, p4-gdp-main-integration]
    paths:
      - 'p4-gdp/**'
      - 'Cargo.toml'
      - 'src/lib.rs'
      - 'src/p4_gdp.rs'
      - 'src/wire/gdp.rs'
      - '.github/workflows/p4-gdp.yml'
  pull_request:
    paths:
      - 'p4-gdp/**'
      - 'Cargo.toml'
      - 'src/lib.rs'
      - 'src/p4_gdp.rs'
      - 'src/wire/gdp.rs'
      - '.github/workflows/p4-gdp.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p4-gdp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build x4c-generated GDP pipeline
        run: cargo check --all-targets
      - name: Run GDP differential tests
        run: cargo test --all-targets
