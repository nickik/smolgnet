name: GNet point-to-point

on:
  push:
    branches: [main, gnet-point-to-point, p4-smolgnet-dataplane]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test GNet stack
        run: cargo test --all-targets
      - name: Test GNet stack with x4c GDP differential decoder
        run: cargo test --all-targets --features p4-gdp-compare
      - name: Check no-std + alloc build
        run: cargo check --no-default-features
      - name: Compare 1 MiB smolgnet and smoltcp loopback
        run: cargo test --release --test performance -- --ignored --nocapture
