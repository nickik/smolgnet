name: GNet point-to-point

on:
  push:
    branches: [main, gnet-point-to-point, heapless-storage-socketset-v2]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test GNet stack
        run: cargo test --all-targets
      - name: Test async/waker support
        run: cargo test --all-targets --features async
      - name: Test hosted TAP adapter
        run: cargo test --all-targets --features host-tap
      - name: Test heapless no-alloc API
        run: cargo test --no-default-features --test heapless_api
      - name: Check no-std without alloc
        run: cargo check --no-default-features
      - name: Compare 1 MiB smolgnet and smoltcp loopback
        run: cargo test --release --test performance -- --ignored --nocapture
