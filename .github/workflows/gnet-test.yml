name: GNet point-to-point

on:
  push:
    branches: [main, gnet-point-to-point, heapless-storage-socketset-v2, p4-gdp-main-integration, p4-gts-hybrid]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Fast PR gate: compile and exercise the normal handwritten stack first.
      # The exhaustive backend matrix and performance suites run on main/manual
      # builds below so ordinary protocol commits fail quickly.
      - name: Fast point-to-point correctness gate
        run: cargo test --all-targets

      - name: Test async/waker support
        run: cargo test --all-targets --features async
      - name: Test heapless no-alloc API
        run: cargo test --no-default-features --test heapless_api
      - name: Check no-std without alloc
        run: cargo check --no-default-features

      - name: Validate complete GDP/GTS backend matrix
        if: github.event_name != 'pull_request'
        run: bash scripts/test-backend-matrix.sh

      - name: Run standalone P4 GDP conformance suite
        if: github.event_name != 'pull_request'
        run: cargo test --manifest-path p4-gdp/Cargo.toml --all-targets

      - name: Microbenchmark handwritten vs P4 GTS RX and TX wire backends
        if: github.event_name != 'pull_request'
        run: GDP_BACKEND=handwritten GTS_BACKEND=p4 bash scripts/backend-cargo.sh test --release --test gts_performance -- --ignored --nocapture

      - name: Throughput handwritten GDP + handwritten GTS
        if: github.event_name != 'pull_request'
        run: GDP_BACKEND=handwritten GTS_BACKEND=handwritten bash scripts/backend-cargo.sh test --release --test performance -- --ignored --nocapture
      - name: Throughput P4 GDP + handwritten GTS
        if: github.event_name != 'pull_request'
        run: GDP_BACKEND=p4 GTS_BACKEND=handwritten bash scripts/backend-cargo.sh test --release --test performance -- --ignored --nocapture
      - name: Throughput handwritten GDP + P4 GTS
        if: github.event_name != 'pull_request'
        run: GDP_BACKEND=handwritten GTS_BACKEND=p4 bash scripts/backend-cargo.sh test --release --test performance -- --ignored --nocapture
      - name: Throughput P4 GDP + P4 GTS
        if: github.event_name != 'pull_request'
        run: GDP_BACKEND=p4 GTS_BACKEND=p4 bash scripts/backend-cargo.sh test --release --test performance -- --ignored --nocapture
